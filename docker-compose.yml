version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: soc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-soc_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-soc_platform_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - soc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-soc_platform_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  soc_pgdata:
    name: soc_platform_pgdata
